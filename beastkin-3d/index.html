<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mutant Lab – Beastkin 3D</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<style>body{margin:0;background:radial-gradient(circle at 50% 30%,#251348,#080613 72%);color:#f1e8ff;font:15px system-ui}header{padding:18px;text-align:center}h2{margin:0;color:#e9b8ff}#stage{height:65vh;min-height:300px;position:relative;touch-action:none}#status{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;background:#211337d9;border-radius:10px;padding:10px;z-index:2;font-size:13px}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}button{background:#30214b;color:white;border:1px solid #9153cf;border-radius:12px;padding:12px 16px}small{display:block;text-align:center;color:#ad9ac8;padding:5px}</style></head><body><header><h2>🧬 MUTANT LAB: GENESIS</h2>Beastkin · Interactive 3D</header><div id="stage"><div id="status">Laadin 3D-mudelit…</div></div><nav><button data-a="Idle_Breathe">Hingamine</button><button data-a="Attack_Lunge">Rünnak</button><button data-a="Victory_Bounce">Võit</button></nav><small>Keera mutanti sõrmega · suumi kahe sõrmega</small>
<script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const s=document.getElementById('status');if(s && !window.beastkinReady)s.textContent='3D-mootor ei ole veel valmis. Kontrolli veateadet.'}));window.addEventListener('error',e=>{document.getElementById('status').textContent='Viga: '+e.message});window.addEventListener('unhandledrejection',e=>{document.getElementById('status').textContent='Laadimisviga: '+String(e.reason)});</script>
<script type="module">
const status=document.getElementById('status');
status.textContent='Kontrollin 3D teeke…';
let THREE,OrbitControls,GLTFLoader;
try {
  THREE=await import('three');
  ({OrbitControls}=await import('three/addons/controls/OrbitControls.js'));
  ({GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js'));
} catch(e) {
  status.textContent='3D teekide laadimise viga: '+(e.message||e);
  throw e;
}
status.textContent='3D teegid laaditud. Käivitan…';
const host=document.getElementById('stage');
try{
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(40,host.clientWidth/host.clientHeight,.1,100);camera.position.set(4,3,3);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.insertBefore(renderer.domElement,status);
scene.add(new THREE.HemisphereLight(0xd2c3ff,0x39215b,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(2,-3,5);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,1);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=10;controls.update();
let mixer,actions={};new GLTFLoader().load('./beastkin_hatchling_animated.glb',g=>{scene.add(g.scene);
const bounds=new THREE.Box3().setFromObject(g.scene);
if(!bounds.isEmpty()) {
  const center=bounds.getCenter(new THREE.Vector3());
  const size=bounds.getSize(new THREE.Vector3());
  const radius=Math.max(size.x,size.y,size.z,0.5);
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(radius*1.8,-radius*2.4,radius*1.35));
  camera.near=Math.max(.01,radius/100);camera.far=Math.max(100,radius*30);camera.updateProjectionMatrix();controls.update();
}
window.beastkinReady=true;mixer=new THREE.AnimationMixer(g.scene);for(const clip of g.animations)actions[clip.name]=mixer.clipAction(clip);actions.Idle_Breathe?.play();status.textContent='Mudel laaditud ✓ · '+g.animations.length+' animatsiooni'},p=>{if(p.total)status.textContent='Laadin mudelit: '+Math.round(p.loaded/p.total*100)+'%'},e=>{status.textContent='GLB laadimine ebaõnnestus: '+(e.message||e);console.error(e)});
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!mixer){status.textContent='Mudel pole veel laaditud';return}Object.values(actions).forEach(a=>a.stop());actions[b.dataset.a]?.reset().play()});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);mixer?.update(clock.getDelta());controls.update();renderer.render(scene,camera)}loop();window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});
}catch(e){status.textContent='3D käivitamise viga: '+(e.message||e);console.error(e)}
</script></body></html>
