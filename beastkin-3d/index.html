<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Mutant Lab – Beastkin 3D</title><style>body{margin:0;background:radial-gradient(circle at 50% 30%,#251348,#080613 72%);color:#f1e8ff;font:15px system-ui}header{padding:18px;text-align:center}h2{margin:0;color:#e9b8ff}#stage{height:67vh;touch-action:none}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}button{background:#30214b;color:white;border:1px solid #9153cf;border-radius:12px;padding:12px 16px}small{display:block;text-align:center;color:#ad9ac8}</style></head><body><header><h2>🧬 MUTANT LAB: GENESIS</h2>Beastkin · Interactive 3D</header><div id="stage"></div><nav><button data-a="Idle_Breathe">Hingamine</button><button data-a="Attack_Lunge">Rünnak</button><button data-a="Victory_Bounce">Võit</button></nav><small>Keera mutanti sõrmega · suumi kahe sõrmega</small><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const host=document.querySelector('#stage'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,host.clientWidth/host.clientHeight,.1,100);camera.position.set(3,-5,2.7);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xd2c3ff,0x39215b,2));let light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(2,-3,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,1.1);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=9;controls.update();let mixer,actions={};new GLTFLoader().load('./beastkin_hatchling_animated.glb',g=>{scene.add(g.scene);mixer=new THREE.AnimationMixer(g.scene);for(const clip of g.animations)actions[clip.name]=mixer.clipAction(clip);actions.Idle_Breathe?.play();},undefined,e=>{host.insertAdjacentHTML('beforeend','<p>GLB laadimine ebaõnnestus. Ava veebiserveri kaudu.</p>');console.error(e)});document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!mixer)return;Object.values(actions).forEach(a=>a.stop());actions[b.dataset.a]?.reset().play()});let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);mixer?.update(clock.getDelta());controls.update();renderer.render(scene,camera)}loop();window.addEventListener('resize',()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)})
</script></body></html>
