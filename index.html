<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101626"><title>Mutant Lab v0.1</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eef6ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#1c3450,#0b1020 65%);min-height:100vh}.app{max-width:510px;margin:auto;padding:20px 16px 45px}h1{margin:6px 0;font-size:29px;letter-spacing:1px}h2{font-size:19px;margin:12px 0}p{color:#aabbd0;line-height:1.5}.tag{color:#58f0c2;font-weight:800;letter-spacing:2px;font-size:11px}.panel{background:#182338;border:1px solid #31435a;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 12px 28px #0003}.mutants{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mutant{background:#22324b;border:2px solid transparent;border-radius:15px;padding:13px 5px;text-align:center;cursor:pointer;color:white}.mutant.selected{border-color:#52e6b7;background:#234c52}.emoji{font-size:39px;display:block;margin-bottom:8px}.mutant strong{font-size:13px;display:block}.mutant small{color:#b3c8d7;font-size:11px}button{font:inherit;cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.primary,.secondary{border:0;border-radius:12px;padding:13px 14px;font-weight:750;color:#071d1c;background:#52e6b7;width:100%;margin-top:8px}.secondary{background:#314762;color:#f4fbff}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#101b2d;border-radius:12px;padding:10px;text-align:center;font-size:12px}.stat b{display:block;font-size:18px;color:#58eac1}.bar{height:11px;background:#354158;border-radius:15px;overflow:hidden;margin:8px 0 14px}.fill{height:100%;background:linear-gradient(90deg,#24b68a,#66f6b5);transition:width .3s}.enemy .fill{background:linear-gradient(90deg,#c34466,#fa7180)}.battlefield{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fighter{text-align:center;background:#101b2d;border-radius:14px;padding:14px 8px}.fighter .emoji{font-size:62px}.fighter b{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{margin:0}.log{max-height:155px;overflow:auto;color:#c4d5e6;font-size:13px;line-height:1.5}.log div{padding:5px 0;border-bottom:1px solid #29384b}.hidden{display:none}.foot{text-align:center;font-size:11px;color:#788da7;margin-top:25px}</style></head><body><main class="app"><div class="tag">PROJECT: GENESIS // v0.1</div><h1>🧬 MUTANT LAB</h1><p>Engineer your mutant. Survive the arena. Evolve your lab.</p><div class="panel"><div class="row"><b>LAB STATUS</b><span id="wallet">🪙 0 · ⭐ Level 1</span></div></div><section id="selectPanel" class="panel"><h2>Choose your first mutant</h2><div class="mutants" id="mutants"></div><button class="primary" id="choose">Begin Experiment</button></section><section id="game" class="hidden"><div class="panel"><div class="row"><h2 id="heroName">Your mutant</h2><span id="level"></span></div><div class="stats"><div class="stat">HEALTH<b id="healthStat"></b></div><div class="stat">ATTACK<b id="attackStat"></b></div><div class="stat">WINS<b id="winsStat"></b></div></div><button class="secondary" id="upgrade">Upgrade attack · 🪙 30</button><button class="secondary" id="heal">Heal fully · 🪙 15</button></div><div class="panel"><div class="row"><h2>⚔️ Arena</h2><span id="round"></span></div><div class="battlefield"><div class="fighter"><span class="emoji" id="heroEmoji"></span><b id="heroLabel"></b><div class="bar"><div class="fill" id="heroBar"></div></div><small id="heroHP"></small></div><div class="fighter enemy"><span class="emoji" id="enemyEmoji">👾</span><b id="enemyLabel">Unknown</b><div class="bar"><div class="fill" id="enemyBar"></div></div><small id="enemyHP"></small></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="attack">⚔️ Attack</button><button class="primary" id="special">✨ Special</button></div><button class="secondary" id="next">Find Opponent</button><div class="log" id="log" aria-live="polite"></div></div><button class="secondary" id="reset">Reset progress</button></section><div class="foot">Free browser prototype · Progress saved on this device</div></main><script>
const types=[{name:'Venomix',emoji:'🐍',hp:100,atk:16,special:'Toxic Bite'},{name:'Pyron',emoji:'🐲',hp:85,atk:21,special:'Fire Burst'},{name:'Bulwark',emoji:'🦏',hp:125,atk:12,special:'Iron Charge'}];const enemies=[{name:'Sporeling',emoji:'🍄',hp:55,atk:9},{name:'Rogue Drone',emoji:'🤖',hp:75,atk:12},{name:'Void Beast',emoji:'👾',hp:95,atk:15}];const $=id=>document.getElementById(id);let chosen=0,game=null,enemy=null,turn=0,finished=true,log=[];function save(){try{localStorage.setItem('mutantLabV01',JSON.stringify(game))}catch(e){}}function load(){try{const x=JSON.parse(localStorage.getItem('mutantLabV01'));if(x&&Number.isInteger(x.type)&&x.type>=0&&x.type<3&&Number.isFinite(x.coins)&&Number.isFinite(x.hp)&&Number.isFinite(x.attack)&&Number.isFinite(x.wins)&&Number.isFinite(x.level))return x}catch(e){}return null}function note(s){log.unshift(s);log=log.slice(0,8);$('log').innerHTML='';for(const t of log){const d=document.createElement('div');d.textContent=t;$('log').appendChild(d)}}function draw(){if(!game)return;const t=types[game.type];$('selectPanel').classList.add('hidden');$('game').classList.remove('hidden');$('wallet').textContent=`🪙 ${game.coins} · ⭐ Level ${game.level}`;$('heroName').textContent=t.name;$('level').textContent=`XP ${game.xp}/${game.level*40}`;$('healthStat').textContent=`${game.hp}/${game.maxHp}`;$('attackStat').textContent=game.attack;$('winsStat').textContent=game.wins;$('heroEmoji').textContent=t.emoji;$('heroLabel').textContent=t.name;$('heroHP').textContent=`${game.hp} / ${game.maxHp} HP`;$('heroBar').style.width=Math.max(0,100*game.hp/game.maxHp)+'%';$('enemyEmoji').textContent=enemy?enemy.emoji:'❔';$('enemyLabel').textContent=enemy?enemy.name:'No opponent';$('enemyHP').textContent=enemy?`${enemy.hp} / ${enemy.maxHp} HP`:'Start a battle';$('enemyBar').style.width=enemy?Math.max(0,100*enemy.hp/enemy.maxHp)+'%':'0%';$('round').textContent=enemy?`Battle ${game.wins+1}`:'Ready';$('attack').disabled=finished;$('special').disabled=finished||turn%3!==0;$('special').textContent=`✨ ${t.special}${turn%3!==0?' (cooldown)':''}`;$('next').disabled=!finished||game.hp<=0;$('next').textContent=game.hp<=0?'Heal before battling':enemy&&enemy.hp<=0?'Next Battle':'Find Opponent';$('upgrade').disabled=game.coins<30;$('heal').disabled=game.coins<15||game.hp===game.maxHp;save()}
function begin(){const t=types[chosen];game={type:chosen,coins:20,hp:t.hp,maxHp:t.hp,attack:t.atk,wins:0,level:1,xp:0};enemy=null;finished=true;note(`Welcome, ${t.name}! Your lab is ready.`);draw()}function spawn(){if(!game||game.hp<=0)return;const base=enemies[Math.min(Math.floor(game.wins/2),2)],boost=Math.floor(game.wins/3)*8;enemy={...base,maxHp:base.hp+boost,hp:base.hp+boost,atk:base.atk+Math.floor(game.wins/3)*2};turn=0;finished=false;note(`${enemy.name} enters the arena!`);draw()}function act(special){if(finished||!enemy)return;const dmg=game.attack+(special?Math.ceil(game.attack*.85):0)+Math.floor(Math.random()*6);enemy.hp=Math.max(0,enemy.hp-dmg);note(`${types[game.type].name} deals ${dmg} damage${special?' with a special attack':''}!`);if(enemy.hp<=0){finished=true;game.wins++;const coins=20+Math.min(game.wins*2,30);game.coins+=coins;game.xp+=20;note(`Victory! +${coins} coins, +20 XP.`);if(game.xp>=game.level*40){game.xp-=game.level*40;game.level++;game.maxHp+=10;game.hp=Math.min(game.maxHp,game.hp+20);game.attack+=2;note(`LEVEL UP! Level ${game.level}.`)}draw();return}const retaliation=Math.max(1,enemy.atk+Math.floor(Math.random()*5)-2);game.hp=Math.max(0,game.hp-retaliation);note(`${enemy.name} hits you for ${retaliation}.`);turn++;if(game.hp<=0){finished=true;enemy=null;note('Defeated! Heal your mutant in the lab to continue.')}draw()}
types.forEach((t,i)=>{const b=document.createElement('button');b.className='mutant'+(i===0?' selected':'');b.innerHTML=`<span class="emoji">${t.emoji}</span><strong>${t.name}</strong><small>HP ${t.hp} · ATK ${t.atk}</small>`;b.onclick=()=>{chosen=i;document.querySelectorAll('.mutant').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('mutants').appendChild(b)});$('choose').onclick=begin;$('next').onclick=spawn;$('attack').onclick=()=>act(false);$('special').onclick=()=>act(true);$('upgrade').onclick=()=>{if(game.coins<30)return;game.coins-=30;game.attack+=3;note('Attack increased by 3!');draw()};$('heal').onclick=()=>{if(game.coins<15||game.hp===game.maxHp)return;game.coins-=15;game.hp=game.maxHp;note('Mutant healed!');draw()};$('reset').onclick=()=>{if(confirm('Erase all Mutant Lab progress on this device?')){try{localStorage.removeItem('mutantLabV01')}catch(e){}location.reload()}};game=load();if(game){note('Welcome back to Mutant Lab!');draw()}
</script></body></html>
