<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120b2c"><title>Mutant Lab v0.4</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#100923}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#45217d,#100923 70%)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}#intro{position:fixed;inset:0;z-index:10;overflow:hidden;background:#0b0920}.scene{position:absolute;inset:-5%;background-position:center;background-size:cover;opacity:0;transform:scale(1.12);transition:opacity 1.1s ease;filter:saturate(1.2)}.scene.active{opacity:1;animation:drift 13s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1.14) translate(-1%,1%)}to{transform:scale(1.28) translate(2%,-2%)}}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,25,.5),transparent 24%,rgba(8,5,25,.25) 43%,rgba(8,5,25,.94) 90%)}.particles{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#f8baff 1px,transparent 2px),radial-gradient(#73f8ff 1px,transparent 2px);background-size:83px 91px,117px 139px;animation:float 17s linear infinite;opacity:.35}@keyframes float{to{background-position:60px -150px,-50px -190px}}.intro-head{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;letter-spacing:3px;color:#d4b8ff;font-weight:900;text-shadow:0 0 12px #ab62ff}.small{border:1px solid #ffffff55;background:#160b35aa;color:white;border-radius:22px;padding:9px 13px}.intro-bottom{position:absolute;left:20px;right:20px;bottom:max(34px,calc(env(safe-area-inset-bottom) + 18px));text-align:center}.scene-title{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#b9fbff;margin-bottom:20px;text-shadow:0 0 15px #00eaff}.subtitle{font-family:Georgia,serif;font-size:clamp(23px,6vw,37px);line-height:1.45;min-height:160px;max-width:680px;margin:auto;text-shadow:0 0 16px #e566ff,0 2px 15px #000}.word{display:inline-block;opacity:.13;filter:blur(3px);transform:translateY(7px);transition:opacity .35s,filter .35s,transform .35s}.word.revealed{opacity:1;filter:blur(0);transform:none}.word.revealed:last-child{text-shadow:0 0 20px #f1a8ff}.progress{display:flex;gap:5px;justify-content:center;margin:16px auto 20px}.progress span{height:4px;width:24px;background:#ffffff44;border-radius:8px}.progress span.current{background:#d969ff;box-shadow:0 0 12px #c85cff}.primary{border:0;background:linear-gradient(120deg,#7c40ff,#e044d7);color:white;font-weight:900;border-radius:16px;padding:15px 24px;box-shadow:0 4px 22px #b84bff77}.hint{font-size:12px;color:#c9b9e4;margin-top:12px}.hidden{display:none!important}#game{max-width:620px;margin:auto;padding:16px 14px 70px}.header{background:linear-gradient(110deg,#42118a,#a82cbd);border:2px solid #b86dff;border-radius:24px;padding:20px;box-shadow:0 0 25px #a63cff44}.header h1{margin:5px 0;font-size:31px;text-shadow:0 0 13px #f0a5ff}.header p{color:#e5d6ff}.nav{display:flex;gap:7px;overflow:auto;padding:15px 0}.nav button{flex:1;min-width:80px;border:1px solid #a46cde;border-radius:14px;background:#28174a;color:#fff;padding:11px 7px;font-weight:700}.nav button.selected{background:#873cf2}.panel{background:linear-gradient(160deg,#2a1857,#1c143c);border:2px solid #8242c6;border-radius:22px;padding:16px;margin:9px 0;box-shadow:0 5px 20px #0005}.panel h2{margin:0 0 12px}.art{height:240px;position:relative;border-radius:18px;background:radial-gradient(circle at 50% 55%,#37e9df,#6c2ac8 60%,#180e3d);display:grid;place-items:center;overflow:hidden;border:2px solid #b45dff}.creature{font-size:115px;filter:drop-shadow(0 0 22px #87ffb0);animation:bob 3s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-10px)}}.stats{display:flex;gap:8px}.stat{flex:1;background:#160e33;padding:12px 4px;text-align:center;border-radius:13px;font-size:12px}.stat strong{display:block;font-size:20px;color:#7cf9cf}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:130px;padding:13px 8px;border:0;border-radius:14px;background:#38d8b2;color:#11233c;font-weight:900}.actions button.alt{background:#e4a8ff}.enemy{display:flex;align-items:center;justify-content:space-around;font-size:70px;gap:10px}.enemy div{text-align:center}.enemy small{display:block;font-size:13px}.bar{height:12px;background:#493659;border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#17cbb0,#a1ff7e);transition:width .3s}.log{font-size:13px;line-height:1.6;color:#dfc9ff;min-height:40px}.muted{color:#c7b2e7;font-size:13px}.storythumb{width:100%;border-radius:14px}.footer{text-align:center;font-size:11px;color:#ac91d0;padding:15px}
@media(prefers-reduced-motion:reduce){.scene.active,.particles,.creature{animation:none}}
</style></head><body>
<section id="intro" aria-label="Story introduction"><div id="scenes"></div><div class="veil"></div><div class="particles"></div><div class="intro-head"><div class="tag">PROJECT GENESIS · v0.4</div><div><button class="small" id="mute">🔊 Voice on</button> <button class="small" id="skip">Skip »</button></div></div><div class="intro-bottom"><div class="scene-title" id="sceneTitle"></div><div class="subtitle" id="subtitle" aria-live="polite"></div><div class="progress" id="progress"></div><button class="primary" id="next">Start story ▶</button><div class="hint" id="hint">Tap to enable narration on iPhone</div></div></section>
<main id="game" class="hidden"><header class="header"><div class="tag">PROJECT GENESIS · VERSION 0.4</div><h1>🧬 MUTANT LAB</h1><p>Hatch weird. Fight fierce. Evolve together.</p><div id="topStats"></div></header><nav class="nav"><button data-tab="lab" class="selected">🧪 Lab</button><button data-tab="arena">⚔️ Arena</button><button data-tab="world">🗺️ World</button><button data-tab="story">📖 Story</button></nav><div id="content"></div><div class="footer">Free browser prototype · Progress saved on this device</div></main>
<script>
'use strict';const $=id=>document.getElementById(id);const lines=[
{title:'01 · The Discovery',text:'In the year 2187, humanity discovered an energy that could rewrite life itself.'},
{title:'02 · Project Genesis',text:'Deep within a remote region, Project Genesis was created. A research facility to harness that energy and create new forms of life.'},
{title:'03 · The Experiment',text:'The experiments pushed the boundaries of nature, and extraordinary creatures began to emerge.'},
{title:'04 · The Catastrophe',text:'But one night, the experiment went terribly wrong. The Genesis Energy broke containment and spread across the world.'},
{title:'05 · The Changed World',text:'The world began to change. Wild mutations, new ecosystems, and powerful creatures appeared everywhere. Only one laboratory remained under control.'},
{title:'06 · The Awakening',text:'And inside it, something was still alive. Now, the future of this world is in your hands, Scientist. Welcome to Mutant Lab.'}
];let scene=0,muted=false,started=false,wordTimer=null,advanceTimer=null,speaking=null,runId=0;const KEY='mutant-lab-v04';const defaults={coins:21,level:2,xp:0,hp:110,maxHp:110,atk:21,wins:2,enemyHp:78,battle:1,tab:'lab'};let game;try{game={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{game={...defaults}};
function save(){localStorage.setItem(KEY,JSON.stringify(game))}function stopNarration(){runId++;clearInterval(wordTimer);clearTimeout(advanceTimer);if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function renderScene(){const id=++runId;document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active',i===scene));$('sceneTitle').textContent=lines[scene].title;$('progress').innerHTML=lines.map((_,i)=>`<span class="${i===scene?'current':''}"></span>`).join('');$('subtitle').innerHTML=lines[scene].text.split(/\s+/).map(w=>`<span class="word"></span> `).join('');const spans=[...$('subtitle').querySelectorAll('.word')];lines[scene].text.split(/\s+/).forEach((w,i)=>spans[i].textContent=w);let index=0;function reveal(n){for(let j=0;j<Math.min(n,spans.length);j++)spans[j].classList.add('revealed')}function animateFallback(){let pace=320;wordTimer=setInterval(()=>{if(id!==runId){clearInterval(wordTimer);return}reveal(++index);if(index>=spans.length)clearInterval(wordTimer)},pace)};
$('next').textContent=scene===5?'Enter Laboratory →':'Continue →';$('hint').textContent=muted?'Narration muted · tap Continue when ready':'Narration and subtitles · tap Continue when ready';
if(!muted&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(lines[scene].text);u.lang='en-US';u.rate=.82;u.pitch=1.12;const voices=window.speechSynthesis.getVoices();const english=voices.filter(v=>v.lang.toLowerCase().startsWith('en'));u.voice=english.find(v=>/samantha|victoria|karen|moira|ava|female|serena|susan|zira/i.test(v.name))||english[0]||null;u.onboundary=e=>{if(id!==runId)return;if(e.name==='word'){const n=lines[scene].text.slice(0,e.charIndex).trim().split(/\s+/).filter(Boolean).length;reveal(n+1)}};u.onend=()=>{if(id===runId){clearInterval(wordTimer);reveal(spans.length)}};u.onerror=()=>{if(id===runId)reveal(spans.length)};speaking=u;window.speechSynthesis.speak(u);animateFallback()}else animateFallback()}
function startScene(){stopNarration();started=true;renderScene()}function nextScene(){if(!started){startScene();return}stopNarration();if(scene===5){finishIntro();return}scene++;renderScene()}
function finishIntro(){stopNarration();$('intro').classList.add('hidden');$('game').classList.remove('hidden');localStorage.setItem('mutant-lab-v04-intro-seen','yes');renderGame()}
function replay(){stopNarration();scene=0;started=false;$('intro').classList.remove('hidden');$('game').classList.add('hidden');document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('active',i===0));$('sceneTitle').textContent='The Awakening';$('subtitle').textContent='Tap Start Story to begin';$('next').textContent='Start story ▶';$('hint').textContent='Tap to enable narration on iPhone';$('progress').innerHTML=''}
$('scenes').innerHTML=lines.map((_,i)=>`<div class="scene ${i===0?'active':''}" style="background-image:url('assets/scene-${i+1}.jpg')"></div>`).join('');$('next').onclick=nextScene;$('skip').onclick=finishIntro;$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Voice off':'🔊 Voice on';if(started)startScene()};$('subtitle').textContent='Tap Start Story to begin';$('sceneTitle').textContent='The Awakening';
function renderGame(){game.hp=Math.max(0,game.hp);$('topStats').textContent=`🪙 ${game.coins}   ⭐ Level ${game.level}   🏆 ${game.wins} wins`;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===game.tab));const c=$('content');if(game.tab==='lab')c.innerHTML=`<section class="panel"><h2>🧪 Your Laboratory</h2><div class="art"><div class="creature">🐉</div></div><h2 style="text-align:center;margin-top:12px">Venomix</h2><p class="muted" style="text-align:center">Your glowing poison companion · XP ${game.xp}/${game.level*40}</p><div class="stats"><div class="stat">HEALTH<strong>${game.hp}/${game.maxHp}</strong></div><div class="stat">ATTACK<strong>${game.atk}</strong></div><div class="stat">WINS<strong>${game.wins}</strong></div></div><div class="actions"><button id="upgrade" ${game.coins<30?'disabled':''}>💪 Upgrade · 30 🪙</button><button class="alt" id="heal" ${game.coins<15||game.hp===game.maxHp?'disabled':''}>💚 Heal · 15 🪙</button></div></section><section class="panel"><h2>✨ The next discovery</h2><p>Fight in the Arena to earn coins and grow stronger. More mutants and hatching are coming in future updates.</p></section>`;
else if(game.tab==='arena')c.innerHTML=`<section class="panel"><h2>⚔️ Genesis Arena · Battle ${game.battle}</h2><div class="enemy"><div>🐉<small>Venomix</small><small>${game.hp}/${game.maxHp} HP</small></div><div>🔥<small>Magmawling</small><small>${game.enemyHp}/78 HP</small></div></div><div class="bar"><i style="width:${game.enemyHp/78*100}%"></i></div><div class="actions"><button id="attack" ${game.hp<=0||game.enemyHp<=0?'disabled':''}>⚔️ Bite</button><button class="alt" id="special" ${game.hp<=0||game.enemyHp<=0?'disabled':''}>☠️ Poison Spit</button><button id="nextBattle" ${game.enemyHp>0?'disabled':''}>Next Battle →</button></div><p class="log" id="battlelog">${game.enemyHp<=0?'Victory! Start the next battle.':'Choose your attack.'}</p></section>`;
else if(game.tab==='world')c.innerHTML=`<section class="panel"><h2>🗺️ The Mutation World</h2><img class="storythumb" src="assets/scene-5.jpg" alt="Mutated glowing wilderness"><p>Explore a world transformed by Genesis Energy. New regions, bosses and creatures will arrive in future versions.</p></section>`;
else c.innerHTML=`<section class="panel"><h2>📖 Project Genesis</h2><img class="storythumb" src="assets/scene-1.jpg" alt="Genesis world"><p>Six cinematic chapters tell the origin of Mutant Lab.</p><button class="primary" id="replay">▶ Replay introduction</button></section>`;
if($('upgrade'))$('upgrade').onclick=()=>{game.coins-=30;game.atk+=4;save();renderGame()};if($('heal'))$('heal').onclick=()=>{game.coins-=15;game.hp=game.maxHp;save();renderGame()};if($('replay'))$('replay').onclick=replay;if($('attack'))$('attack').onclick=()=>fight(false);if($('special'))$('special').onclick=()=>fight(true);if($('nextBattle'))$('nextBattle').onclick=()=>{game.battle++;game.enemyHp=78;save();renderGame()}}
function fight(special){if(game.enemyHp<=0||game.hp<=0)return;let dmg=game.atk+(special?12:0);game.enemyHp=Math.max(0,game.enemyHp-dmg);let msg=`Venomix dealt ${dmg} damage!`;if(game.enemyHp===0){game.coins+=24;game.xp+=20;game.wins++;msg+=' Victory! +24 coins, +20 XP.';if(game.xp>=game.level*40){game.xp-=game.level*40;game.level++;game.maxHp+=10;game.hp=game.maxHp;game.atk+=3;msg+=' Level up!'}}else{const hit=7+Math.floor(Math.random()*6);game.hp=Math.max(0,game.hp-hit);msg+=` Magmawling hits back for ${hit}.`;if(game.hp===0)msg+=' Venomix fainted. Heal in the Lab.'}save();renderGame();$('battlelog').textContent=msg}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{game.tab=b.dataset.tab;save();renderGame()});if(localStorage.getItem('mutant-lab-v04-intro-seen')==='yes')finishIntro();
</script></body></html>
