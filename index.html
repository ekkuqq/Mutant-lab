<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100a25"><title>Mutant Lab — Cinematic Chapter 1</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#09071b;color:#fff}button{font:inherit;cursor:pointer}#app{min-height:100dvh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#5d248c 0%,#211247 42%,#080819 100%)}#app:before{content:"";position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(circle at 20% 20%,#db4bff33,transparent 25%),radial-gradient(circle at 85% 60%,#2ddaff22,transparent 30%);animation:drift 16s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}.wrap{position:relative;max-width:680px;margin:auto;min-height:100dvh;padding:22px 18px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.13em;font-size:14px;text-shadow:0 0 15px #da4bff}.small{font-size:12px;color:#bcb1db}.pill{background:#251a48bb;border:1px solid #a86cda88;border-radius:99px;padding:8px 12px}.scene{flex:1;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}.panel{width:100%;background:linear-gradient(145deg,#24163eeb,#101229ed);border:1px solid #a35eea88;border-radius:22px;padding:20px;box-shadow:0 0 35px #a63cff20,inset 0 0 25px #a63cff0d}.title{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0;text-shadow:0 0 24px #c856ff}.subtitle{line-height:1.65;color:#e5d9ff;font-size:17px;max-width:520px;min-height:80px}.enter{animation:enter 1s ease both}@keyframes enter{from{opacity:0;transform:translate(15px,-12px);filter:blur(7px)}to{opacity:1;transform:translate(0);filter:blur(0)}}.glow{color:#f2d6ff;text-shadow:0 0 16px #d855ff}.btn{border:1px solid #d581ff;background:linear-gradient(110deg,#712fe1,#d72fc8);color:white;border-radius:14px;padding:14px 18px;font-weight:800;box-shadow:0 0 18px #b92fff55}.btn:disabled{opacity:.4}.secondary{background:#24183d;box-shadow:none}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}.art{width:min(100%,420px);height:245px;position:relative;border-radius:22px;overflow:hidden;border:1px solid #a957ef;background:radial-gradient(ellipse at 50% 65%,#7a42c7 0%,#2d1c5a 43%,#101329 75%);box-shadow:0 0 40px #8e36d555}.art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 34px,#8b5cdb1a 35px 37px,transparent 38px 72px);perspective:100px}.art:after{content:"";position:absolute;bottom:-30px;left:15%;width:70%;height:95px;border:4px solid #bd66ff;border-radius:50%;box-shadow:0 0 35px #d85bff, inset 0 0 25px #d85bff;transform:rotateX(62deg)}.orb{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:110px;filter:drop-shadow(0 0 25px #e77aff);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translate(-50%,-13px)}}.beam{position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,#b464ff16 50%,transparent 70%)}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%}.choice{background:#211538;border:1px solid #8253c8;border-radius:15px;padding:14px 5px;display:flex;flex-direction:column;gap:8px;align-items:center;color:#fff}.choice.selected{outline:2px solid #ef95ff;box-shadow:0 0 20px #cf4fff66}.egg{font-size:53px;filter:drop-shadow(0 0 16px #ad4eff)}.mutant{font-size:105px;filter:drop-shadow(0 0 25px #cc5bff)}.bar{height:13px;background:#302345;border-radius:30px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#5ef5ac,#34cf75);transition:width .4s}.enemybar>div{background:linear-gradient(90deg,#fa9c62,#f34e7e)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.log{min-height:66px;font-size:15px;line-height:1.5}.progress{display:flex;gap:5px}.progress span{height:4px;background:#5b4279;border-radius:9px;flex:1}.progress span.on{background:#d56bff;box-shadow:0 0 9px #e87cff}.foot{text-align:center;color:#a59ac6;font-size:11px}.toggle{font-size:12px;background:#211637;color:white;border:1px solid #8a59b8;border-radius:20px;padding:8px}.list{text-align:left;line-height:2}.highlight{color:#9dffdd} @media(max-width:370px){.options{gap:5px}.choice{font-size:12px}.egg{font-size:42px}}

/* v0.5 cinematic story styling */
.scene:has(.cinematic){justify-content:stretch;min-height:0;flex:1}
.cinematic{position:relative;width:100%;min-height:min(70dvh,740px);border-radius:24px;overflow:hidden;isolation:isolate;background:#130b28;display:flex;align-items:flex-end;border:1px solid #bd79ff80;box-shadow:0 10px 50px #0009}
.cinematic-photo{position:absolute;inset:-5%;background-image:var(--bg);background-position:center;background-size:cover;animation:cameraFloat 18s ease-in-out infinite alternate;filter:saturate(1.15)}
.cinematic-shade{position:absolute;inset:0;background:linear-gradient(to bottom,#08051c38 0%,#08051c12 28%,#09051b99 52%,#080518f5 74%,#080518 100%)}
.cinematic-content{position:relative;z-index:2;width:100%;padding:26px 15px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cinematic-title{font-size:clamp(23px,6vw,38px);line-height:1.1;margin:0;letter-spacing:.055em;text-shadow:0 0 16px #e18bff,0 2px 14px #000}
.cinematic-subtitle{font-size:clamp(15px,3.9vw,19px);line-height:1.65;color:#fff;min-height:112px;margin:0;max-width:520px;text-shadow:0 2px 8px #000,0 0 18px #b866ff66}
.subtitle-line{display:block}.word{display:inline-block;opacity:0;filter:blur(4px);transform:translate(9px,-7px);animation:wordArrive .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.12s + var(--i)*.15s)}
@keyframes wordArrive{to{opacity:1;filter:blur(0);transform:translate(0,0)}}
@keyframes cameraFloat{from{transform:scale(1.06) translate(-1%,1%)}to{transform:scale(1.15) translate(1%,-1%)}}
.cinematic .actions{gap:9px}.cinematic .actions .actions{display:contents}.cinematic .btn{font-size:14px;padding:12px 15px}
.confirmation{display:flex;flex-direction:column;align-items:center;gap:10px}.confirmation .subtitle{min-height:0}
@media(prefers-reduced-motion:reduce){.cinematic-photo,.word{animation:none}.word{opacity:1;filter:none;transform:none}}
@media(max-height:700px){.cinematic{min-height:540px}}
</style></head><body><main id="app"><div class="wrap"><header class="top"><div><div class="brand">🧬 MUTANT LAB</div><div class="small">PROJECT GENESIS · CHAPTER 1</div></div><button class="toggle" id="voice">🔇 Voice off</button></header><div class="progress" id="progress"></div><section class="scene" id="scene" aria-live="polite"></section><footer class="foot">Prototype · Local save · No paid services</footer></div></main><script>
'use strict';const $=id=>document.getElementById(id);const scene=$('scene');const progress=$('progress');let step=0,story=0,power=false,log=false,selected='Pyron',starter=null,hp=100,enemy=70,defending=false,busy=false,voice=false;const creatures={Pyron:{emoji:'🦊',egg:'🔥',type:'Fire',skill:'Ember',damage:22},Frostel:{emoji:'🐧',egg:'❄️',type:'Ice',skill:'Frostbite',damage:18},Verdant:{emoji:'🐉',egg:'🌿',type:'Nature',skill:'Vine Lash',damage:19}};const lines=[
['THE AWAKENING','In the year 2187, humanity discovered a rare energy that could rewrite life itself.'],
['THE GENESIS INITIATIVE','Deep within a remote region, Project Genesis was created to understand that energy.'],
['THE FIRST MUTATIONS','The experiments pushed the boundaries of nature. Extraordinary creatures began to emerge.'],
['THE NIGHT OF SILENCE','But one night, the experiment went terribly wrong. Genesis Energy broke containment and spread across the world.'],
['A WORLD REBORN','The world began to change. Wild mutations, new ecosystems, and powerful creatures appeared everywhere. Only one laboratory remained under control.'],
['YOUR STORY BEGINS','Now, the future of this world is in your hands, Scientist. Welcome to Mutant Lab.']];
let speechToken=0;
function narrate(t){if(!voice||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;u.pitch=1.12;u.volume=.85;const vs=speechSynthesis.getVoices();const f=vs.find(v=>/Samantha|Karen|Victoria|Serena|female/i.test(v.name)&&v.lang.startsWith('en'));if(f)u.voice=f;window.speechSynthesis.speak(u)}
function cinematicText(t){return `<span class="subtitle-line enter" aria-label="${t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${t.split(' ').map((w,i)=>`<span class="word" style="--i:${i}">${w.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`).join(' ')}</span>`}
function speak(t){if(!voice||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.82;u.pitch=1.08;u.volume=.8;let vs=speechSynthesis.getVoices(),f=vs.find(v=>/female|samantha|karen|victoria|serena/i.test(v.name)&&v.lang.startsWith('en'));if(f)u.voice=f;speechSynthesis.speak(u)}$('voice').onclick=()=>{voice=!voice;$('voice').textContent=voice?'🔊 Voice on':'🔇 Voice off';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel();if(voice&&step===0)narrate(lines[story][1])};function buttons(items){return `<div class="actions">${items.map(([t,fn,cls=''])=>`<button class="btn ${cls}" onclick="${fn}">${t}</button>`).join('')}</div>`}function art(emoji){return `<div class="art"><div class="beam"></div><div class="orb">${emoji}</div></div>`}function show(){progress.innerHTML=Array.from({length:step===0?6:6},(_,i)=>`<span class="${i<=(step===0?story:step)?'on':''}"></span>`).join('');if(step===0){let [heading,text]=lines[story];scene.innerHTML=`<div class="cinematic" style="--bg:url('assets/scene-${story+1}.jpg')"><div class="cinematic-photo" aria-hidden="true"></div><div class="cinematic-shade"></div><div class="cinematic-content"><div class="small glow">PROJECT GENESIS · ${story+1} / 6</div><h1 class="cinematic-title enter">${heading}</h1><p class="cinematic-subtitle">${cinematicText(text)}</p><div class="actions">${buttons([[story===5?'Enter the facility →':'Continue →','nextStory()'],['Skip intro','go(1)','secondary']])}</div></div></div>`;narrate(text)}else if(step===1){scene.innerHTML=`${art('👁️')}<div class="panel"><div class="small glow">LYRA · GENESIS OPERATIONS AI</div><h1 class="title">A signal... at last.</h1><p class="subtitle enter">You're alive. I am LYRA, the facility's remaining operational intelligence. I need your help to restore the laboratory.</p></div>${buttons([['I will help','go(2)']])}`;speak('A signal... at last. You are alive. I am Lyra, the facility’s remaining operational intelligence. I need your help to restore the laboratory.')}else if(step===2){scene.innerHTML=`${art('🏚️')}<h1 class="title">Explore the Ruins</h1><div class="panel list"><div>${power?'✅':'⬜'} Restore emergency power</div><div>${log?'✅':'⬜'} Read the Genesis research log</div><div>✅ Reconnect LYRA</div></div>${buttons([[power?'Power restored':'⚡ Restore power','restore()','secondary'],[log?'Log recovered':'📖 Read research log','readLog()','secondary'],['Enter incubation chamber →','go(3)']])}`;scene.querySelectorAll('.actions button')[2].disabled=!(power&&log)}else if(step===3){scene.innerHTML=`<div class="small glow">LYRA: Three viable life signatures remain.</div><h1 class="title">Choose Your First Egg</h1>${art('🥚')}<div class="options">${Object.entries(creatures).map(([name,c])=>`<button class="choice ${selected===name?'selected':''}" onclick="pick('${name}')"><span class="egg">${c.egg}</span><b>${name}</b><span class="small">${c.type}</span></button>`).join('')}</div><p class="small">All starters are free. Other species can be discovered later.</p>${buttons([['Hatch '+selected+' →','hatch()']])}`;}else if(step===4){scene.innerHTML=`<div class="small glow">INCUBATION SUCCESSFUL</div>${art(creatures[starter].emoji)}<h1 class="title">Meet ${starter}!</h1><p class="subtitle enter">A new bond is formed. LYRA detects an unfamiliar presence approaching the facility...</p>${buttons([['Defend the laboratory →','go(5)']])}`;speak('Incubation successful. A new bond is formed. Warning. An unfamiliar presence is approaching the facility.')}else if(step===5){drawBattle()}else{scene.innerHTML=`${art('🏆')}<h1 class="title">Chapter 1 Complete!</h1><div class="panel"><p class="highlight">You protected the Genesis facility and bonded with ${starter}.</p><p>🎁 Rewards: 100 Genesis Crystals · 1 Starter Crate</p><p class="small">Chapter 2: The Genesis Initiative — coming next</p></div>${buttons([['Replay Chapter 1','restart()'],['Continue to existing game','alert("This standalone demo does not yet connect to your existing game. We will integrate it after testing.")','secondary']])}`;speak('Chapter one complete. But something beyond the forest has detected your new companion. This is only the beginning.')}}function nextStory(){if(story<5){story++;show()}else go(1)}function go(n){step=n;show()}function restore(){power=true;show();speak('Emergency power restored.')}function readLog(){log=true;show();speak('Research log recovered. The energy was not created here. It was discovered.')}function pick(n){selected=n;show()}function hatch(){const c=creatures[selected];scene.innerHTML=`<div class="panel confirmation"><div class="small glow">FINAL CHOICE</div><div class="egg">${c.egg}</div><h1 class="title">Hatch ${selected}?</h1><p class="subtitle">Your ${c.type.toLowerCase()} companion will become your first mutant. You can discover other species later.</p><p class="small">Confirm your choice to continue.</p>${buttons([['Yes, hatch '+selected,'confirmHatch()'],['Choose another egg','go(3)','secondary']])}</div>`}
function confirmHatch(){starter=selected;localStorage.setItem('mutantlab_demo_starter',starter);go(4)}function drawBattle(msg='A wild Rager blocks the exit. Choose an ability.'){scene.innerHTML=`<h1 class="title">First Battle</h1><div class="stats"><div class="panel"><b>${starter} · Lv. 1</b><div class="bar"><div style="width:${hp}%"></div></div><div class="small">${hp}/100 HP</div></div><div class="panel"><b>Wild Rager · Lv. 2</b><div class="bar enemybar"><div style="width:${enemy/70*100}%"></div></div><div class="small">${enemy}/70 HP</div></div></div>${art(creatures[starter].emoji+' ⚔️ 🐺')}<div class="panel log enter">${msg}</div>${buttons([['⚔️ Bite','attack(14)'],['✨ '+creatures[starter].skill,`attack(${creatures[starter].damage})`],['🛡️ Focus','focus()','secondary']])}`;if(busy)scene.querySelectorAll('button').forEach(b=>b.disabled=true)}function focus(){if(busy)return;defending=true;counter('You brace for impact. Incoming damage is reduced.')}function attack(d){if(busy)return;enemy=Math.max(0,enemy-d);if(enemy===0){step=6;localStorage.setItem('mutantlab_demo_chapter1_complete','yes');show();return}counter(`${starter} attacks for ${d} damage!`)}function counter(message){busy=true;drawBattle(message);setTimeout(()=>{let dmg=defending?5:12;defending=false;hp=Math.max(0,hp-dmg);busy=false;if(hp===0){hp=100;enemy=70;drawBattle('LYRA restored your team. Try using Focus to reduce damage.')}else drawBattle(message+` The Rager hits back for ${dmg}.`)},850)}function restart(){step=0;story=0;power=false;log=false;hp=100;enemy=70;starter=null;show()}show();</script></body></html>
