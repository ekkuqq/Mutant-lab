<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mutant Lab 3D v5</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#392052,#100b20 65%);color:#f8f1ff;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:24px 16px 50px}h1{margin:0;font-size:26px}p{color:#c7b4da}#viewer{height:min(65vh,530px);min-height:350px;border:1px solid #8d50bd;border-radius:24px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 70%,#482264,#140d28 70%);touch-action:none}#viewer canvas{display:block;width:100%;height:100%}.tag{position:absolute;top:14px;left:14px;padding:8px 12px;border-radius:20px;background:#170d2bca;border:1px solid #9e61ce;font-size:12px;pointer-events:none}.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ead8fa;font-size:12px;pointer-events:none}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.levels button, #reset{padding:13px 5px;border-radius:13px;border:1px solid #754a91;background:#261b38;color:white;font-weight:700}.levels button.active{background:#9948c9;border-color:#d9a2f4}.info{padding:16px;border:1px solid #5d3b7a;border-radius:16px;background:#211731}#status{font-size:13px;color:#d8b9ec}button{cursor:pointer}#reset{margin-top:12px;padding:10px 18px}small{color:#b6a3c8}</style></head><body><main><h1>🧬 Mutant Lab · 3D v5</h1><p>Interactive Beastkin · DNA Evolution Preview</p><div id="viewer"><div class="tag" id="tag">LV 1 · HATCHLING</div><div class="hint">↔ Lohista pööramiseks · kahe sõrmega suumi</div></div><div class="levels"><button data-level="1" class="active">Lv 1</button><button data-level="10">Lv 10</button><button data-level="25">Lv 25</button><button data-level="50">Lv 50</button></div><div class="info"><strong id="title">Abyssal Beastkin · Hatchling</strong><p id="desc">Päris pööratav 3D-prototüüp. Algne DNA ja liigiline identiteet säilivad.</p><small id="status">3D-mootori laadimine…</small><br><button id="reset">Taasta kaamera</button></div></main><script type="module">

}

if(lv>=50){sphere(root,0,1.48,.99,.19,.22,.12,purple);for(let i=0;i<7;i++)cone(root,Math.sin(i*2.4)*.45,1.75,-.55+i*.13,.09,.28,purple)}
}
